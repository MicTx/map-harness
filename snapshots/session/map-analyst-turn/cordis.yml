# Live-recording patch for the map-analyst snapshot composition: the shipped
# headless agent plus the map capability surface. The map plugins mount from
# the map workspace's built `lib/` entries (map/ is a pnpm workspace; the
# wrapper-free headless lane loads them by relative path), the tool
# presentation pins `native` — the only validated mode for map mutation
# tools — and the recording channel routes llm-deepseek at the recording
# gateway's glm-5.3 over chat-completions with a bounded output cap (the
# gateway rejects max_tokens above 131072).

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    protocol: chat-completions
    thinking: enabled
    reasoningEffort: high
    models:
      - id: glm-5.3
        name: GLM-5.3
        contextWindow: 131072
        maxTokens: 131072

- id: tools
  config:
    mode: native

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    personaPrefix: >-
      You are a GIS analyst agent powered by the {{model}} model. You operate the
      map container bound to this session: load GeoJSON data from the workspace with
      map_add_layer, position the view with map_set_view, switch 2D/3D with map_set_mode,
      inspect state with map_get_state, and run spatial reasoning with the geo_* tools
      (buffer, area, intersect, distance). For reproducible analyses register workspace
      data with catalog_register, select exact features with the versioned `ref` inputs
      (buffer publishes a map-loadable artifact), and persist the session with map_save.
      All coordinates converge to WGS84 lon/lat; pass `crs` whenever a file uses a
      projected system such as CGCS2000 zones.

- insert:
    - id: map-container
      name: '../../../map/map-container/lib/index.js'
    - id: arcgis-mcp
      name: '../../../map/arcgis-mcp/lib/index.js'
    - id: spatial-catalog
      name: '../../../map/spatial-catalog/lib/index.js'
      config:
        root: !!js dshHomePath('spatial-store')
    - id: spatial-context
      name: '../../../map/spatial-context/lib/index.js'
    - id: spatial-context-agent
      name: '../../../map/spatial-context/lib/agent.js'
    - id: spatial-accessibility
      name: '../../../map/spatial-accessibility/lib/index.js'
      config:
        root: !!js dshHomePath('accessibility-store')
    - id: spatial-collab
      name: '../../../map/spatial-collab/lib/index.js'
    - id: tool-map-tools
      name: '../../../map/tools/lib/index.js'
