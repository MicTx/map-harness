# Live-recording patch for the map-data-resourcing snapshot composition: the
# shipped headless agent plus the map capability surface with the P1 data
# resourcing tools. The map plugins mount from the map workspace's built
# `lib/` entries, the tool presentation pins `native`. Re-recording requires
# a DeepSeek-compatible deployment exposing deepseek-chat; keyless replay uses the
# sibling patch and never contacts that deployment.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: high
    models:
      - id: deepseek-chat
        name: DeepSeek Chat
        contextWindow: 131072
        maxTokens: 131072

- id: tools
  config:
    mode: native

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    personaPrefix: >-
      You are a GIS analyst agent powered by the {{model}} model. You operate the
      map container bound to this session: load GeoJSON data from the workspace with
      map_add_layer, position the view with map_set_view, switch 2D/3D with map_set_mode,
      inspect state with map_get_state, and run spatial reasoning with the geo_* tools
      (buffer, area, intersect, distance). For reproducible analyses register workspace
      data with catalog_register or import CSV/KML/Shapefile data with data_import, select
      exact features with the versioned `ref` inputs, export layers or exact refs as
      geojson/CSV/KML/shapefile artifacts with data_export, and persist the session with
      map_save. All coordinates converge to WGS84 lon/lat; pass `crs` whenever a file
      uses a projected system such as CGCS2000 zones.

- insert:
    - id: map-container
      name: '../../../map/map-container/lib/index.js'
    - id: arcgis-mcp
      name: '../../../map/arcgis-mcp/lib/index.js'
    - id: spatial-catalog
      name: '../../../map/spatial-catalog/lib/index.js'
      config:
        root: !!js dshHomePath('spatial-store')
    - id: spatial-context
      name: '../../../map/spatial-context/lib/index.js'
    - id: spatial-context-agent
      name: '../../../map/spatial-context/lib/agent.js'
    - id: spatial-accessibility
      name: '../../../map/spatial-accessibility/lib/index.js'
      config:
        root: !!js dshHomePath('accessibility-store')
    - id: spatial-collab
      name: '../../../map/spatial-collab/lib/index.js'
    - id: tool-map-tools
      name: '../../../map/tools/lib/index.js'
