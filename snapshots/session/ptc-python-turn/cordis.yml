# Python PTC composition: replace the Node provider through
# the real Loader and render the generated Python SDK prompt.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js 'process.env.DSH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@deepseek-ai/dsh-tools'
  config:
    mode: ptc

- id: ptc-runtime
  disabled: true

- id: workflow-ptc
  disabled: true

- id: tool-workflow
  disabled: true

- insert:
    - id: ptc-runtime-python
      name: '@deepseek-ai/dsh-experimental-ptc-runtime-python'
      config:
        # Resolve a CPython >= 3.10 interpreter from PATH by default; hosts whose
        # python3 is older point PTC_PYTHON_BIN at a suitable absolute path.
        pythonBin: !!js process.env.PTC_PYTHON_BIN ?? 'python3'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.
